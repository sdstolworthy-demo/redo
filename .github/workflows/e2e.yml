name: e2e against preview

on:
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the Amplify Gen 3 preview deployment
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          query='[.check_runs[] | select((.name | startswith("Amplify Gen 3")) or (.name | startswith("Omega")))] | sort_by(.started_at) | last'
          for attempt in $(seq 1 120); do
            run=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" --jq "$query")
            if [ -n "$run" ] && [ "$run" != "null" ]; then
              status=$(jq -r .status <<<"$run")
              conclusion=$(jq -r .conclusion <<<"$run")
              echo "Check run '$(jq -r .name <<<"$run")': status=${status} conclusion=${conclusion}"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::Amplify Gen 3 preview deployment concluded with ${conclusion}"
                  exit 1
                fi
                echo "url=$(jq -r .details_url <<<"$run")" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "Waiting for the Amplify Gen 3 check run on ${HEAD_SHA}..."
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for the Amplify Gen 3 preview deployment"
          exit 1

      - name: Print preview URL
        run: echo "Running e2e tests against ${{ steps.preview.outputs.url }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
